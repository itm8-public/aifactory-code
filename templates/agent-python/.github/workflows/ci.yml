# Build, test and scan. No deployment: itm8's Wizard generates the deploy pipelines.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE_TEST: app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo --redact --no-banner
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Container build (no push)
        run: docker build -t app:ci .

  # Static analysis. CodeQL needs GitHub Advanced Security on the repository; without it, remove
  # this job and add another analyzer (for example Semgrep) instead.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4
