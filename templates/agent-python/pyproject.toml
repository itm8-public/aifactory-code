[project]
name = "aifactory-app-template"
version = "0.1.0"
description = "__TITLE__: an itm8 AI Factory agent (Microsoft Agent Framework on Azure AI Foundry)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "agent-framework-foundry==1.15.0",
  "agent-framework-openai==1.17.0",
  "azure-identity>=1.27,<2",
  "fastapi>=0.162,<1",
  "psycopg[binary]>=3.3,<4",
  "psycopg-pool>=3.3,<4",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
