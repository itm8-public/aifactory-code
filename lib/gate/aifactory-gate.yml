# itm8 AI Factory gate. Installed by the aifactory-code plugin (/aifactory-code:gate).
# Source of truth: templates/aifactory-gate.yml in the aifactory-gate repository; keep in step.
# The ruleset on main requires the check "gate / verdict". Do not rename the job "gate".
name: aifactory gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # the gate signs in to itm8's review Foundry with GitHub OIDC when ai-review is on

jobs:
  gate:
    uses: itm8-public/aifactory-gate/.github/workflows/gate.yml@v0
    with:
      zone: {{ZONE}} # green, yellow or red, as registered for the solution
      level: {{LEVEL}} # 1 advisory, 2 customer changes and itm8 approves, 3 itm8 owns CI/CD
      node-version: '{{NODE_VERSION}}'
      test-command: {{TEST_COMMAND}}
      # The AI review, once the customer has agreed to it. Values come from itm8 at onboarding.
      ai-review: false
      review-endpoint: ''
      azure-client-id: ''
      azure-tenant-id: ''
